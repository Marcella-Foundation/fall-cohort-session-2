<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Keeping</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1b2e;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    width: 800px;
    height: 800px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(46, 204, 168, 0.18) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1.4rem, 3vw, 2.2rem);
    width: 100%;
    max-width: 900px;
    padding: 3vh 4vw;
    animation: fadeInUp 1s ease-out;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    color: rgba(255, 255, 255, 0.55);
    font-size: clamp(0.85rem, 1.6vw, 1rem);
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  h1 {
    color: #ffffff;
    font-size: clamp(2.2rem, 5.5vw, 3.6rem);
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1.1;
    text-align: center;
    text-shadow: 0 2px 20px rgba(46, 204, 168, 0.3);
  }

  h1 span {
    color: #2ecca8;
  }

  ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 100%;
  }

  li {
    color: #ffffff;
    font-size: clamp(1.05rem, 2.1vw, 1.4rem);
    line-height: 1.4;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  li::before {
    content: '';
    flex: 0 0 auto;
    width: 8px;
    height: 8px;
    margin-top: 0.5em;
    border-radius: 50%;
    background: #2ecca8;
    box-shadow: 0 0 10px rgba(46, 204, 168, 0.7);
  }
</style>
</head>
<body>

<div class="content">
  <div class="eyebrow">Reminders</div>
  <h1>House <span>Keeping</span></h1>

  <ul>
    <li>Food sometimes permitted (please ask)</li>
    <li>Bring a laptop to every session (talk to me if you need help)</li>
    <li>Responsible phone use permitted. (Please help us take pictures/videos and submit at the end of the session)</li>
    <li>Please let me know if you know you will be absent</li>
  </ul>
</div>

</body>
</html>
